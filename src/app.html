<!DOCTYPE html>
<!--
  DeepSeek Chat Reader v2
  Source: https://github.com/DeepSeek-Chat-Reader/DeepSeek-Chat-Reader.github.io
  Built with Vite + TypeScript; this file is the Vite entry (build artifact = ./index.html)
-->
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="appTitle">DeepSeek Chat Reader</title>
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
    <div class="loading" id="loading" hidden>
        <div class="loading-spinner"></div>
        <div data-i18n="loadingText"></div>
    </div>

    <!-- 上传模态窗口 -->
    <div class="modal-overlay" id="modalOverlay" hidden></div>
    <div class="modal" id="uploadModal" role="dialog" aria-modal="true" hidden>
        <div class="modal-header">
            <h3 data-i18n="uploadModalTitle"></h3>
            <button class="close-modal" id="closeModal" aria-label="Close">&times;</button>
        </div>
        <div class="upload-section">
            <div class="file-upload" id="dropZone" role="button" tabindex="0">
                <i class="fa-solid fa-cloud-arrow-up" style="font-size:32px;color:#3498db;margin-bottom:8px;"></i>
                <p data-i18n="dropZoneText"></p>
                <input type="file" id="fileInput" accept=".json,application/json" hidden>
            </div>
            <div>
                <h3 style="font-size:0.95rem;margin-bottom:8px;" data-i18n="manualInputTitle"></h3>
                <textarea class="json-input" id="jsonInput" data-i18n-placeholder="jsonInputPlaceholder" spellcheck="false"></textarea>
                <button id="parseButton" data-i18n="parseButton"></button>
                <p><span data-i18n="helpText"></span><a href="https://github.com/DeepSeek-Chat-Reader/DeepSeek-Chat-Reader.github.io/blob/main/README.md#how-to-use" target="_blank" rel="noopener" data-i18n="viewInstructions"></a></p>
            </div>
        </div>
    </div>

    <!-- 打印模态窗口 -->
    <div class="modal-overlay" id="printModalOverlay" hidden></div>
    <div class="modal" id="printModal" role="dialog" aria-modal="true" hidden style="max-width:360px;">
        <div class="modal-header">
            <h3 data-i18n="printOptions"></h3>
            <button class="close-modal" id="closePrintModal" aria-label="Close">&times;</button>
        </div>
        <div class="upload-section" style="border-bottom:none;">
            <label class="print-option">
                <input type="checkbox" id="printThinkCheck" checked>
                <span data-i18n="printExpandThink"></span>
            </label>
            <label class="print-option">
                <input type="checkbox" id="printSearchCheck" checked>
                <span data-i18n="printExpandSearch"></span>
            </label>
            <p class="print-option-hint" data-i18n="printExpandThinkHint"></p>
            <button id="doPrintBtn" data-i18n="printNow"></button>
        </div>
    </div>

    <!-- 语言模态窗口 -->
    <div class="modal-overlay" id="languageModalOverlay" hidden></div>
    <div class="modal" id="languageModal" role="dialog" aria-modal="true" hidden style="max-width:280px;">
        <div class="modal-header">
            <h3 data-i18n="language"></h3>
            <button class="close-modal" id="closeLanguageModal" aria-label="Close">&times;</button>
        </div>
        <div class="upload-section" style="border-bottom:none;">
            <button id="langZhBtn" class="lang-btn">中文</button>
            <button id="langEnBtn" class="lang-btn">English</button>
        </div>
    </div>

    <!-- 设置模态窗口 -->
    <div class="modal-overlay" id="settingsModalOverlay" hidden></div>
    <div class="modal" id="settingsModal" role="dialog" aria-modal="true" hidden style="max-width:360px;">
        <div class="modal-header">
            <h3 data-i18n="settings"></h3>
            <button class="close-modal" id="closeSettingsModal" aria-label="Close">&times;</button>
        </div>
        <div class="upload-section" style="border-bottom:none;">
            <label class="print-option">
                <input type="checkbox" id="edgeRevealCheck" checked>
                <span data-i18n="edgeReveal"></span>
            </label>
            <p class="print-option-hint" data-i18n="edgeRevealHint"></p>
            <label class="print-option" for="fontSizeSelect"><span data-i18n="fontSize"></span></label>
            <select id="fontSizeSelect" style="width:100%; margin-bottom:10px;">
                <option value="0.875" data-i18n="fontSmall"></option>
                <option value="1" data-i18n="fontNormal"></option>
                <option value="1.125" data-i18n="fontLarge"></option>
                <option value="1.25" data-i18n="fontXLarge"></option>
            </select>
            <label class="print-option">
                <input type="checkbox" id="hcCheck">
                <span data-i18n="highContrast"></span>
            </label>
            <p class="print-option-hint" data-i18n="highContrastHint"></p>
        </div>
    </div>

    <!-- 保存模态窗口 -->
    <div class="modal-overlay" id="saveModalOverlay" hidden></div>
    <div class="modal" id="saveModal" role="dialog" aria-modal="true" hidden style="max-width:400px;">
        <div class="modal-header">
            <h3 data-i18n="saveModalTitle"></h3>
            <button class="close-modal" id="closeSaveModal" aria-label="Close">&times;</button>
        </div>
        <div class="upload-section" style="border-bottom:none;">
            <h4 style="margin-bottom:10px;" data-i18n="saveCurrentPage"></h4>
            <button id="saveOriginalBtn" style="margin-bottom:10px;">
                <i class="fa-brands fa-github"></i> <span data-i18n="downloadFromGitHub"></span>
            </button>
            <button id="saveOriginalGiteeBtn" style="margin-bottom:10px;">
                <i class="fa-brands fa-git-alt"></i> <span data-i18n="downloadFromGitee"></span>
            </button>
            <button id="saveOfflineBtn" class="btn-failure" style="margin-bottom:10px;">
                <i class="fa-regular fa-file-code"></i> <span data-i18n="saveSnapshot"></span>
            </button>
            <h4 style="margin-bottom:10px;" data-i18n="saveEditedConversations"></h4>
            <button id="saveJsonBtn" style="margin-bottom:10px;">
                <i class="fa-solid fa-file-export"></i> <span data-i18n="saveAsJSON"></span>
            </button>
            <button id="saveHtmlBtn" class="btn-failure" style="margin-bottom:10px;">
                <i class="fa-regular fa-comments"></i> <span data-i18n="saveWithSnapshot"></span>
            </button>
        </div>
    </div>

    <header>
        <div class="header-main">
            <h1><i class="fa-regular fa-comments"></i> <span data-i18n="appTitle"></span></h1>
            <p><span data-i18n="lastUpdated"></span><a href="https://github.com/DeepSeek-Chat-Reader/DeepSeek-Chat-Reader.github.io/" target="_blank" rel="noopener" data-i18n="projectHomepage"></a></p>
        </div>
        <div class="header-controls">
            <button id="languageBtn" aria-label="Language">
                <i class="fa-solid fa-globe"></i> <span data-i18n="languageShort"></span>
            </button>
            <button id="uploadModalBtn" aria-label="Upload JSON">
                <i class="fa-solid fa-folder-open"></i> <span data-i18n="uploadJSON"></span>
            </button>
            <button id="viewListBtn" aria-label="Conversation list">
                <i class="fa-solid fa-list"></i> <span data-i18n="viewList"></span>
            </button>
            <button id="viewContentBtn" aria-label="Reading view">
                <i class="fa-regular fa-file-lines"></i> <span data-i18n="viewContent"></span>
            </button>
            <button id="tableViewBtn" aria-label="Full list">
                <i class="fa-solid fa-table-list"></i> <span data-i18n="tableView"></span>
            </button>
            <button id="toggleOutlineBtn" aria-label="Toggle Outline">
                <i class="fa-solid fa-list-ol"></i> <span data-i18n="outline"></span>
            </button>
            <div class="font-steps" role="group" aria-label="Font size">
                <button id="fontDecBtn" aria-label="Smaller font">A−</button>
                <button id="fontIncBtn" aria-label="Larger font">A+</button>
            </div>
            <button id="settingsBtn" aria-label="Settings">
                <i class="fa-solid fa-gear"></i> <span data-i18n="settings"></span>
            </button>
            <button id="themeToggle" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i> <span data-i18n="darkMode"></span>
            </button>
            <button id="saveBtn" aria-label="Save">
                <i class="fa-solid fa-download"></i> <span data-i18n="saveOffline"></span>
            </button>
            <button id="printBtn" aria-label="Print">
                <i class="fa-solid fa-print"></i> <span data-i18n="printConversations"></span>
            </button>
            <button id="resetBtn" class="btn-danger" aria-label="Reset">
                <i class="fa-solid fa-xmark"></i> <span data-i18n="closeConversations"></span>
            </button>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar-ribbon" id="sidebarRibbon" title="对话列表" aria-label="Conversation list"></div>
        <aside class="sidebar" id="sidebar">
            <div class="conversation-list" id="conversationList">
                <div class="batch-actions" id="batchActions" hidden>
                    <button class="batch-select" id="batchSelectBtn" data-i18n="batchSelect"></button>
                    <button class="batch-select-all" id="batchSelectAllBtn" data-i18n="selectAll"></button>
                    <button class="batch-invert" id="batchInvertBtn" data-i18n="invertSelection"></button>
                    <button class="batch-delete btn-danger" id="batchDeleteBtn" data-i18n="deleteSelected"></button>
                    <button class="batch-cancel" id="batchCancelBtn" data-i18n="cancelBatch"></button>
                </div>
                <div class="search-filters" id="searchFilters">
                    <div class="search-filters-toggle">
                        <button id="filterToggle" aria-label="Toggle filters">
                            <i class="fa-solid fa-sliders"></i> <span data-i18n="filters"></span>
                        </button>
                    </div>
                    <div class="search-filters-body">
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" aria-label="Search">
                        </div>
                        <div class="search-stats" id="searchStats"></div>
                        <div class="date-filter">
                            <input type="date" id="filterStartDate" aria-label="Start date">
                            <input type="date" id="filterEndDate" aria-label="End date">
                        </div>
                        <div class="sort-options">
                            <select id="sortFieldSelect" aria-label="Sort by">
                                <option value="inserted_at" data-i18n="sortByStartDate"></option>
                                <option value="updated_at" data-i18n="sortByLastDate"></option>
                                <option value="title" data-i18n="sortTitle"></option>
                                <option value="turns" data-i18n="colTurns"></option>
                                <option value="chars" data-i18n="colChars"></option>
                            </select>
                            <div class="sort-direction">
                                <button id="sortAscBtn" class="active" data-i18n="ascending"></button>
                                <button id="sortDescBtn" data-i18n="descending"></button>
                            </div>
                        </div>
                        <div class="branch-display-options">
                            <label for="defaultBranchDisplay" data-i18n="defaultBranchDisplay"></label>
                            <select id="defaultBranchDisplay" aria-label="Default branch">
                                <option value="first" data-i18n="firstBranch"></option>
                                <option value="last" data-i18n="lastBranch"></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="conversation-list-header">
                    <span><i class="fa-solid fa-list"></i> <span data-i18n="conversationList"></span></span>
                    <span id="conversationCount"></span>
                </div>
                <div class="conversations-container" id="conversationsContainer"></div>
            </div>
        </aside>

        <section class="list-info" id="listInfoPanel" hidden></section>

        <!-- Full-page conversation list (table view, Explorer-like) -->
        <section class="table-panel" id="tablePanel" hidden>
            <div class="table-toolbar">
                <div class="table-filters">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="tableSearchInput" data-i18n-placeholder="searchPlaceholder" aria-label="Search">
                    </div>
                    <select id="tableSortField" aria-label="Sort by">
                        <option value="inserted_at" data-i18n="sortByStartDate"></option>
                        <option value="updated_at" data-i18n="sortByLastDate"></option>
                        <option value="title" data-i18n="sortTitle"></option>
                        <option value="turns" data-i18n="colTurns"></option>
                        <option value="chars" data-i18n="colChars"></option>
                    </select>
                    <button id="tableSortDirBtn" class="sort-dir" title="Sort direction">
                        <i class="fa-solid fa-arrow-down-wide-short"></i> <span data-i18n="descending"></span>
                    </button>
                    <input type="date" id="tableStartDate" aria-label="Start date">
                    <input type="date" id="tableEndDate" aria-label="End date">
                </div>
                <span class="table-stats" id="tableStats"></span>
                <div class="table-actions">
                    <button id="tableBatchBtn" class="batch-select" data-i18n="batchSelect"></button>
                    <button id="tableSelectAllBtn" class="batch-select-all" hidden data-i18n="selectAll"></button>
                    <button id="tableInvertBtn" class="batch-invert" hidden data-i18n="invertSelection"></button>
                    <button id="tableDeleteBtn" class="batch-delete btn-danger" hidden data-i18n="deleteSelected"></button>
                    <button id="tableCancelBtn" class="batch-cancel" hidden data-i18n="cancelBatch"></button>
                </div>
            </div>
            <div class="table-scroll">
                <table class="conv-table">
                    <thead>
                        <tr>
                            <th class="col-check"></th>
                            <th data-sort="title" data-i18n="colTitle"></th>
                            <th data-sort="inserted_at" data-i18n="colStart"></th>
                            <th data-sort="updated_at" data-i18n="colEnd"></th>
                            <th data-sort="turns" data-i18n="colTurns"></th>
                            <th data-sort="chars" data-i18n="colChars"></th>
                            <th class="col-actions"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>

        <div class="resize-handle" id="resizeHandle" aria-hidden="true"></div>

        <section class="content-area collapsed" id="contentArea">
            <div class="content-toolbar" id="contentToolbar" hidden>
                <div class="search-box content-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="mobileSearchInput" data-i18n-placeholder="searchInContent" aria-label="Search in conversation">
                    <span class="search-result-count" id="contentSearchCount"></span>
                    <button class="search-nav" id="contentSearchPrev" aria-label="Previous match" disabled><i class="fa-solid fa-chevron-up"></i></button>
                    <button class="search-nav" id="contentSearchNext" aria-label="Next match" disabled><i class="fa-solid fa-chevron-down"></i></button>
                    <button class="search-nav" id="contentSearchClear" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="conversation-detail" id="conversationDetailContainer"></div>
            <div class="outline-ribbon" id="outlineRibbon" title="大纲" aria-label="Outline"></div>
        </section>

        <aside class="outline-sidebar collapsed" id="outlineSidebar">
            <div class="outline-header">
                <span data-i18n="outline"></span>
                <button class="toggle-outline-btn" id="collapseOutlineBtn" aria-label="Collapse outline">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="outline-content" id="outlineContent"></div>
        </aside>
    </div>
</body>
</html>
